};
let UPD = null, EP = null;
// ---------- 2D overlay: pop subtitles (word by word), red cards, flash / black / red hit ----------
const OV = document.createElement("canvas"); OV.width = W; OV.height = H; const og = OV.getContext("2d");
const SEG = new Intl.Segmenter("th", { granularity: "word" }); const VIS = (q) => q.replace(/[ัิ-ฺ็-๎\s]/g, "").length;

function words(ph) { if (ph._w) return ph._w; const out = []; let pos = 0; ph.sub.split("<br>").forEach((l, li) => l.split(/(<b>.*?<\/b>)/).forEach((q) => { if (!q) return; const b = q.startsWith("<b>"); for (const w of SEG.segment(q.replace(/<\/?b>/g, ""))) { out.push({ t: w.segment, b, line: li, f: pos }); pos += VIS(w.segment); } })); out.forEach((w) => (w.f /= Math.max(1, pos))); return (ph._w = out); }
