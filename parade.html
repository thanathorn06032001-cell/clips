$('bSong').onclick=()=>{MU.mode=MU.mode==='song'?'synth':'song';try{localStorage.setItem('pr_mode',MU.mode)}catch(e){}muInit();muMode();muLabel()};
$('bMu').onclick=()=>{MU.on=!MU.on;try{localStorage.setItem('pr_mu',MU.on?'1':'0')}catch(e){}muInit();muVol();muLabel()};
$('bMv').onclick=()=>{const L=[.3,.45,.6,.8,1];MU.vol=L[(L.findIndex(v=>v>=MU.vol-.01)+1)%L.length];try{localStorage.setItem('pr_mv',MU.vol)}catch(e){}muVol();muLabel()};
$('bVoice').onclick=()=>{muInit();try{speechSynthesis.cancel()}catch(e){}V.busy=false;V.q=[];say('ทดสอบเสียง ม่วนซื่นโฮแซว!',3);setTimeout(voiceStatus,300)};
$('gear').onclick=()=>$('panel').classList.toggle('show');
$('bHide').onclick=()=>{$('panel').classList.remove('show');document.body.classList.add('live')};
let taps=[];$('hot').addEventListener('pointerdown',()=>{const n=Date.now();taps=taps.filter(t=>n-t<900);taps.push(n);if(taps.length>=3){taps=[];document.body.classList.remove('live');$('panel').classList.add('show')}});
const NM=['น้องฝน','Beam','ป้าแดง','ลุงดู่','Aom','Plo','เจ๊หมวย','Nok','มะปราง','ต้นกล้า','แม่ค้า','Zin','ก้อย','บอย','ใบเตย','โอ๊ต','แจ็ค','มิว','เบล','ต้า','นัท','กิ๊ฟ','ปาล์ม','ฟ้า'];let ni=0;
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;if(k==='join'){for(let i=0;i<6;i++){const n=NM[ni%NM.length]+(ni>=NM.length?ni:'');ni++;handle({type:'chat',user:'u'+ni,nick:n,comment:'เต้น'})}return}
 if(k==='ms'){if(S.ms)msEnd(false);msStart();return}
 if(k==='mun'){S.crowd.slice(0,6).forEach(c=>handle({type:'chat',user:c.id,nick:c.nick,comment:pick(['ม่วนๆ','โย่','ม่วนซื่น','โย่ว'])}));return}
 const c=S.crowd.length?pick(S.crowd):{id:'u0',nick:'น้องฝน'};if(k==='rose10')return handle({type:'gift',user:c.id,nick:c.nick,giftName:'Rose',diamonds:1,count:10});if(k==='like')return handle({type:'like',user:c.id,nick:c.nick,count:20});
 const G={rose:['Rose',1],tiktok:['TikTok',1],donut:['Doughnut',30],hands:['Hand Hearts',100],money:['Money Gun',500],galaxy:['Galaxy',1000],whale:['Whale diving',2150],universe:['TikTok Universe',44999]}[k];handle({type:'gift',user:c.id,nick:c.nick,giftName:G[0],diamonds:G[1],count:1})});
</script>
