<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>รถแห่ม่วนซื่น — เกมไลฟ์</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Mitr',sans-serif;overflow:hidden}
#stage{position:absolute;width:720px;height:1280px;transform-origin:0 0;overflow:hidden}#cv{position:absolute;inset:0}
.ov{position:absolute;pointer-events:none}
#title{left:0;right:0;top:8px;text-align:center}
#title h1{margin:0;font-size:54px;line-height:1.05;font-weight:600;background:linear-gradient(#fff7c0,#ffcf3a 50%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6a1a00) drop-shadow(0 0 16px rgba(255,170,40,.7))}
#lv{left:90px;right:90px;top:72px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);border:2px solid #ffcf3a;overflow:hidden}
#lv .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff3d9a,#ffcf3a);transition:width .4s}
#lv .tx{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:14px;text-shadow:0 1px 2px #000}
#strip{left:0;right:0;top:104px;height:92px;overflow:hidden}
#strip .rail{display:flex;gap:8px;position:absolute;left:0;top:0;animation:slide 26s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.card{width:104px;height:88px;flex:none;border-radius:12px;background:linear-gradient(180deg,rgba(60,20,90,.9),rgba(25,8,40,.92));border:2px solid rgba(255,207,58,.7);text-align:center;padding-top:4px}
.card i{font-style:normal;font-size:30px;line-height:1.1;display:block}.card b{display:block;font-size:12.5px;font-weight:500;line-height:1.15;padding:0 3px}.card small{color:#ffcf3a;font-size:11.5px}
#top{left:8px;top:206px;width:168px;font-size:13px;background:rgba(20,6,35,.78);border:2px solid #ff3d9a;border-radius:12px;padding:6px 8px}
#top h3{margin:0 0 3px;font-size:15px;color:#ffcf3a;font-weight:500}#top .r{display:flex;justify-content:space-between}#top .r span:first-child{max-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bar{left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:8px 14px;border-radius:14px;background:rgba(0,0,0,.62);border:2px solid #ffcf3a}
#bar b{color:#ffcf3a}
#toasts{left:180px;right:4px;top:206px;display:flex;flex-direction:column;align-items:center;gap:5px}
.toast{background:rgba(30,6,40,.88);border:1.5px solid #ffcf3a;border-radius:20px;padding:4px 14px;font-size:17px;animation:tin .3s ease-out,tout .5s ease-in 3s forwards;white-space:nowrap;max-width:660px;overflow:hidden;text-overflow:ellipsis}
.toast b{color:#ffcf3a}@keyframes tin{from{transform:scale(.7);opacity:0}}@keyframes tout{to{opacity:0}}
#banner{left:40px;right:40px;top:560px;text-align:center;display:none}
#banner div{background:rgba(30,6,40,.92);border:3px solid #ffcf3a;border-radius:16px;padding:14px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#banner h2{margin:0;font-size:34px;color:#ffcf3a}#banner p{margin:6px 0 0;font-size:19px}@keyframes pop{from{transform:scale(.3);opacity:0}}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5}
#start button{font:inherit;font-size:34px;padding:20px 36px;border-radius:20px;border:3px solid #ffcf3a;background:linear-gradient(#ff3d9a,#8a0a5a);color:#fff}
#gear{position:fixed;left:6px;top:6px;z-index:10;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,207,58,.5);background:rgba(0,0,0,.4);color:#fff;font-size:18px;opacity:.6}
body.live #gear{display:none}#hot{position:fixed;left:0;top:0;width:70px;height:70px;z-index:8}
#panel{position:fixed;left:6px;top:50px;z-index:9;max-width:340px;background:rgba(10,4,20,.94);padding:8px;border-radius:12px;border:1px solid #ffcf3a;font-size:13px;display:none}
#panel.show{display:block}#panel .row{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0;align-items:center}
#panel button{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid #ffcf3a;background:#2a1430;color:#fff}
#panel input{font:inherit;font-size:13px;padding:5px 7px;border-radius:7px;border:1px solid #5a3a5e;background:#1e1222;color:#fff;width:130px}
#panel .st{color:#ffcf7a;font-size:12px}
</style>
</head>
<body>
<div id="stage">
 <canvas id="cv" width="720" height="1280"></canvas>
 <div class="ov" id="title"><h1>รถแห่ม่วนซื่น</h1></div>
 <div class="ov" id="lv"><div class="fill" id="lvf"></div><div class="tx"><span>🔥 ความม่วน LV <b id="lvn">1</b></span><span id="lvt">0/300</span></div></div>
 <div class="ov" id="strip"><div class="rail" id="rail"></div></div>
 <div class="ov" id="top"><h3>👑 ขาแดนซ์ Top 5</h3><div id="tl"></div></div>
 <div class="ov" id="toasts"></div>
 <div class="ov" id="banner"><div><h2 id="bnT"></h2><p id="bnP"></p></div></div>
 <div class="ov" id="bar"><span>💃 พิมพ์ <b>"เต้น"</b> มาเต้นด้วยกัน!</span><span>ในขบวน <b id="cnt">0</b></span></div>
 <div id="start"><button id="bStart">🎉 แตะเพื่อเริ่ม</button></div>
</div>
<div id="hot"></div><button id="gear">⚙️</button>
<div id="panel">
 <div class="row"><b style="color:#ffcf3a">🎛️ ผู้จัด</b><button id="bMu">🎵 เพลง: เปิด</button><button id="bMv">ความดัง 60%</button><button id="bHide">🙈 ซ่อนทั้งหมด</button></div>
 <div class="row"><button id="bVoice">🔊 ทดสอบเสียง</button><span class="st" id="vst"></span></div>
 <div class="row"><input id="ttUser" placeholder="ชื่อ TikTok"><button id="bConn">เชื่อมต่อ</button></div>
 <div class="st" id="wst">โหมดทดสอบ</div>
 <div class="row">ทดสอบ: <button data-s="join">+6 คนเต้น</button><button data-s="like">❤️</button><button data-s="rose">🌹</button><button data-s="tiktok">🎵</button><button data-s="donut">🍩</button><button data-s="hands">🫶</button><button data-s="money">💸</button><button data-s="galaxy">🎤</button><button data-s="whale">🐋</button><button data-s="universe">🌌</button></div>
</div>
<script>
'use strict';
const W=720,H=1280,$=i=>document.getElementById(i),cv=$('cv'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=n=>String(n||'').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').trim()||'เพื่อน';
/* ---------- state ---------- */
const BPM=132;const S={t:0,beat:0,crowd:[],onStage:[],parts:[],fw:[],lan:[],lvl:1,fun:0,need:300,score:{},led:'รถแห่ม่วนซื่น • พิมพ์ "เต้น" มาม่วนกัน!',ledT:0,party:0,lead:null,whale:null,scroll:0};
/* ---------- gifts ---------- */
const GIFTS=[
 {k:'rose',re:/^rose$|rosa|กุหลาบ|โรซ่า/i,icon:'🌹',n:'ขึ้นเวที 15 วิ',d:'1'},
 {k:'tiktok',re:/tiktok|finger ?heart|heart me|หัวใจ/i,icon:'🎵',n:'ทุกตัวเต้นฉลอง',d:'1'},
 {k:'donut',re:/doughnut|donut|โดนัท/i,icon:'🍩',n:'ยิงพลุ',d:'30'},
 {k:'hands',re:/hand ?hearts|มือ/i,icon:'🫶',n:'โคมลอยทั้งฟ้า',d:'100'},
 {k:'money',re:/money ?gun|ปืน/i,icon:'💸',n:'ฝนแบงก์ร้อย',d:'500'},
 {k:'galaxy',re:/galaxy|กาแล็กซี/i,icon:'🎤',n:'นักร้องนำ 30 วิ',d:'1000'},
 {k:'whale',re:/whale|วาฬ/i,icon:'🐋',n:'วาฬทองบินผ่าน',d:'2150'},
 {k:'universe',re:/universe|จักรวาล/i,icon:'🌌',n:'คอนเสิร์ตใหญ่!',d:'44999'},
];
$('rail').innerHTML=[...GIFTS,...GIFTS].map(g=>`<div class="card"><i>${g.icon}</i><b>${g.n}</b><small>💎${g.d}</small></div>`).join('');
/* ---------- background (parallax village) ---------- */
const far=document.createElement('canvas');far.width=1440;far.height=700;const mid=document.createElement('canvas');mid.width=1440;mid.height=700;
(function(){let g=far.getContext('2d');
 g.fillStyle='#1d0f3a';for(let x=0;x<1440;x+=110){const h=rnd(60,140);g.beginPath();g.moveTo(x,600);g.lineTo(x+55,600-h);g.lineTo(x+110,600);g.fill()}
 // temple roof silhouette
 [[300,600],[1000,600]].forEach(([x,b])=>{g.fillStyle='#2a1450';g.beginPath();g.moveTo(x-90,b);g.lineTo(x,b-170);g.lineTo(x+90,b);g.fill();g.fillStyle='#ffcf3a';g.globalAlpha=.25;g.fillRect(x-2,b-200,4,30);g.globalAlpha=1});
 g=mid.getContext('2d');
 for(let x=0;x<1440;x+=240){// stilt house
  g.fillStyle='#2b1430';g.fillRect(x+30,500,150,70);g.fillStyle='#3a1c3c';g.beginPath();g.moveTo(x+15,505);g.lineTo(x+105,440);g.lineTo(x+195,505);g.fill();
  g.fillStyle='rgba(255,190,90,.75)';g.fillRect(x+60,520,26,22);g.fillRect(x+120,520,26,22);g.fillStyle='#2b1430';for(let k=0;k<4;k++)g.fillRect(x+40+k*42,570,6,40);
  // palm
  const px=x+215;g.strokeStyle='#1a0c20';g.lineWidth=7;g.beginPath();g.moveTo(px,610);g.quadraticCurveTo(px+10,520,px-4,450);g.stroke();g.lineWidth=5;for(let k=0;k<6;k++){const a=-Math.PI/2+(k-2.5)*.5;g.beginPath();g.moveTo(px-4,450);g.quadraticCurveTo(px-4+Math.cos(a)*40,450+Math.sin(a)*24,px-4+Math.cos(a)*70,470+Math.sin(a)*20);g.stroke()}}
 // string lights
 for(let x=0;x<1440;x+=20){const y=430+Math.sin(x/240*Math.PI*2)*12;g.fillStyle=['#ff3d9a','#ffcf3a','#3de0ff','#7dff8a'][(x/20)%4];g.globalAlpha=.8;g.beginPath();g.arc(x,y,3,0,7);g.fill()}g.globalAlpha=1})();
/* ---------- characters ---------- */
const OUT=[['#ff3d9a','#ffcf3a'],['#3de0ff','#ffffff'],['#a040e0','#ffcf3a'],['#20c070','#fff3b0'],['#ff7a1a','#3a1a60'],['#ffffff','#e8203a'],['#ffd23a','#2a6ab0']];
function mkPerson(id,nick,av){return{id,nick,av,img:av?mkImg(av):null,out:pick(OUT),girl:Math.random()<.5,hair:pick(['#1a0d08','#3b2014','#111','#c9a040']),skin:pick(['#f6d2ad','#e8b88a','#d9a070']),move:pick(['bounce','wave','soeng','disco','clap','swing']),ph:rnd(0,6),last:Date.now()}}
function drawPerson(p,x,y,s,opt={}){const b=S.beat+p.ph*.02,hop=Math.abs(Math.sin(b*Math.PI))*(opt.party?14:7),mv=opt.party?'jump':p.move;
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,0,22,6,0,0,7);ctx.fill();ctx.translate(0,-hop);
 const sw=Math.sin(b*Math.PI*2),[c1,c2]=p.out;
 // legs
 ctx.strokeStyle=p.skin;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-6,-22);ctx.lineTo(-8-sw*4,0);ctx.moveTo(6,-22);ctx.lineTo(8-sw*4,0);ctx.stroke();
 // outfit
 ctx.fillStyle=c1;if(p.girl){ctx.beginPath();ctx.moveTo(-12,-52);ctx.lineTo(12,-52);ctx.lineTo(17,-18);ctx.lineTo(-17,-18);ctx.closePath();ctx.fill();ctx.fillStyle=c2;ctx.fillRect(-14,-36,28,4)}else{rr(-12,-52,24,22,6);ctx.fill();ctx.fillStyle=c2;rr(-11,-32,22,12,3);ctx.fill()}
 // arms by move
 let L,R;const a=sw;
 if(mv==='wave'){L=[-26,-80+a*6];R=[26,-80-a*6]}else if(mv==='soeng'){L=[-22+a*6,-62-Math.abs(a)*14];R=[22+a*6,-62-Math.abs(a)*14]}else if(mv==='disco'){L=a>0?[-24,-84]:[-24,-30];R=a>0?[24,-30]:[24,-84]}
 else if(mv==='clap'){L=[-4-Math.abs(a)*12,-62];R=[4+Math.abs(a)*12,-62]}else if(mv==='swing'){L=[-26,-46+a*10];R=[26,-46-a*10]}else{L=[-22,-78];R=[22,-78]}
 ctx.strokeStyle=p.skin;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-10,-48);ctx.lineTo(...L);ctx.moveTo(10,-48);ctx.lineTo(...R);ctx.stroke();
 // head
 ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(0,-66,15,0,7);ctx.fill();ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(0,-70,15.5,Math.PI*1.02,Math.PI*1.98);ctx.fill();
 if(p.girl){ctx.fillRect(-15,-70,5,18);ctx.fillRect(10,-70,5,18)}
 ctx.fillStyle='#2a1208';ctx.beginPath();ctx.arc(-5,-66,1.8,0,7);ctx.arc(5,-66,1.8,0,7);ctx.fill();ctx.strokeStyle='#2a1208';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,-62,4,.2,Math.PI-.2);ctx.stroke();
 ctx.fillStyle='rgba(255,110,140,.45)';ctx.beginPath();ctx.arc(-9,-61,3,0,7);ctx.arc(9,-61,3,0,7);ctx.fill();
 if(opt.crown){ctx.fillStyle='#ffcf3a';ctx.beginPath();ctx.moveTo(-10,-82);ctx.lineTo(-10,-92);ctx.lineTo(-5,-86);ctx.lineTo(0,-95);ctx.lineTo(5,-86);ctx.lineTo(10,-92);ctx.lineTo(10,-82);ctx.fill()}
 if(opt.mic){ctx.fillStyle='#333';ctx.fillRect(R[0]-2,R[1]-2,4,14);ctx.fillStyle='#bbb';ctx.beginPath();ctx.arc(R[0],R[1]-4,5,0,7);ctx.fill()}
 ctx.restore()}
function avatar(p,x,y,r,ring='#fff'){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();let h=0;for(const c of p.nick)h=(h*31+c.charCodeAt(0))>>>0;ctx.fillStyle=`hsl(${h%360},60%,55%)`;ctx.fillRect(x-r,y-r,2*r,2*r);
 if(p.img&&p.img.complete&&p.img.naturalWidth)ctx.drawImage(p.img,x-r,y-r,2*r,2*r);else{ctx.fillStyle='#fff';ctx.font=`600 ${r}px Mitr, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText([...p.nick][0]||'?',x,y+1)}ctx.restore();ctx.lineWidth=2.5;ctx.strokeStyle=ring;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke()}
function label(t,x,y,sz=13,bgc='rgba(20,6,35,.78)'){ctx.font=`500 ${sz}px Mitr, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const w=ctx.measureText(t).width+12;ctx.fillStyle=bgc;rr(x-w/2,y-sz*.75,w,sz*1.5,sz*.75);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(t,x,y)}
/* ---------- band on truck ---------- */
const BAND=[{role:'แคน',x:250},{role:'พิณ',x:345},{role:'กลอง',x:445},{role:'คีย์บอร์ด',x:560}].map(b=>Object.assign(b,mkPerson('band_'+b.role,b.role)));BAND.forEach((b,i)=>{b.out=[['#e8203a','#ffcf3a'],['#2a6ab0','#ffcf3a'],['#111','#ff3d9a'],['#7a1ad0','#fff']][i];b.girl=false});
const DANCERS=[0,1,2,3].map(i=>Object.assign(mkPerson('d'+i,'หางเครื่อง'),{girl:true,out:[['#ff3d9a','#ffcf3a'],['#ffcf3a','#ff3d9a'],['#3de0ff','#fff'],['#ff7ad0','#ffcf3a']][i],move:pick(['soeng','wave','disco'])}));
function drawInstrument(b,x,y){ctx.save();ctx.translate(x,y);
 if(b.role==='กลอง'){ctx.fillStyle='#c02a3a';ctx.beginPath();ctx.ellipse(0,-22,24,16,0,0,7);ctx.fill();ctx.fillStyle='#eee';ctx.beginPath();ctx.ellipse(0,-30,24,7,0,0,7);ctx.fill();ctx.fillStyle='#ffcf3a';ctx.beginPath();ctx.ellipse(-30,-52,12,3,0,0,7);ctx.ellipse(30,-48,12,3,0,0,7);ctx.fill()}
 if(b.role==='คีย์บอร์ด'){ctx.fillStyle='#222';ctx.fillRect(-28,-50,56,10);ctx.fillStyle='#fff';for(let k=0;k<9;k++)ctx.fillRect(-26+k*6,-48,4,6);ctx.fillStyle='#555';ctx.fillRect(-2,-40,4,40)}
 if(b.role==='พิณ'){ctx.save();ctx.rotate(-.6);ctx.fillStyle='#b5651d';ctx.beginPath();ctx.ellipse(0,-40,12,9,0,0,7);ctx.fill();ctx.fillRect(-2,-90,4,50);ctx.fillStyle='#ffcf3a';ctx.fillRect(-4,-94,8,6);ctx.restore()}
 if(b.role==='แคน'){ctx.fillStyle='#c9a060';for(let k=0;k<7;k++)ctx.fillRect(-14+k*4,-104+Math.abs(k-3)*3,3,58-Math.abs(k-3)*3);ctx.fillStyle='#6a4020';ctx.beginPath();ctx.ellipse(0,-62,7,9,0,0,7);ctx.fill()}
 ctx.restore()}
/* ---------- truck ---------- */
function drawTruck(){const deck=640,sh=Math.sin(S.t*20)*.6;ctx.save();ctx.translate(0,sh);
 // truss + LED
 ctx.strokeStyle='#8a8aa0';ctx.lineWidth=4;ctx.strokeRect(186,268,520,22);for(let x=186;x<706;x+=20){ctx.beginPath();ctx.moveTo(x,268);ctx.lineTo(x+20,290);ctx.stroke()}[190,700].forEach(x=>{ctx.strokeRect(x-6,290,12,350)});
 ctx.fillStyle='#0a0612';rr(214,300,470,230,8);ctx.fill();ctx.strokeStyle='#ffcf3a';ctx.lineWidth=3;ctx.stroke();
 ctx.save();rr(218,304,462,222,6);ctx.clip();
 const g=ctx.createLinearGradient(0,304,0,526);g.addColorStop(0,'#2a0a4a');g.addColorStop(1,'#120420');ctx.fillStyle=g;ctx.fillRect(218,304,462,222);
 for(let i=0;i<24;i++){const h=(Math.abs(Math.sin(S.beat*Math.PI+i*.7))*.7+.3)*90*(S.party?1.3:1);const hue=(i*15+S.t*40)%360;ctx.fillStyle=`hsla(${hue},90%,60%,.55)`;ctx.fillRect(226+i*19,520-h,13,h)}
 ctx.font='600 40px Mitr, sans-serif';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='#ff3d9a';ctx.shadowBlur=14;const tw=ctx.measureText(S.led).width;const xx=680-((S.t*120)%(tw+480));ctx.fillText(S.led,xx,360);ctx.shadowBlur=0;
 if(S.lead){avatar(S.lead,620,446,40,'#ffcf3a');ctx.font='500 18px Mitr, sans-serif';ctx.fillStyle='#ffcf3a';ctx.textAlign='center';ctx.fillText('🎤 นักร้องนำ',620,500);ctx.textAlign='left'}
 ctx.restore();
 // speakers
 [[150,470],[690,470]].forEach(([x,y])=>{ctx.fillStyle='#141418';rr(x-36,y,72,170,6);ctx.fill();ctx.fillStyle='#2a2a30';for(let k=0;k<3;k++){const pul=1+Math.abs(Math.sin(S.beat*Math.PI))*.12;ctx.beginPath();ctx.arc(x,y+30+k*52,20*pul,0,7);ctx.fill();ctx.fillStyle='#55556a';ctx.beginPath();ctx.arc(x,y+30+k*52,7,0,7);ctx.fill();ctx.fillStyle='#2a2a30'}});
 // band + stage dancers
 ctx.fillStyle='#1c1c28';ctx.fillRect(200,deck-34,500,34);ctx.fillStyle='#ffcf3a';ctx.fillRect(200,deck-34,500,3);
 BAND.forEach(b=>{drawPerson(b,b.x,deck-34,.92);drawInstrument(b,b.x+(b.role==='กลอง'?0:9),deck-34)});
 // deck

const V={q:[],busy:false,voice:null,t:null};
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();V.voice=vs.find(v=>/^th/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/^th/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,prio=1){if(!('speechSynthesis' in window))return;V.q.push({t,prio});if(V.q.length>3){V.q.sort((a,b)=>b.prio-a.prio);V.q.length=3}next()}
function next(){if(V.busy||!V.q.length){if(!V.busy&&MU.duck)MU.duck.gain.setTargetAtTime(1,AC.currentTime,.15);return}const it=V.q.shift();V.busy=true;if(MU.duck)MU.duck.gain.setTargetAtTime(.35,AC.currentTime,.1);
 const u=new SpeechSynthesisUtterance(it.t);u.lang='th-TH';if(V.voice)u.voice=V.voice;u.rate=1.12;u.pitch=1.1;const done=()=>{if(!V.busy)return;V.busy=false;clearTimeout(V.t);setTimeout(next,150)};u.onend=done;u.onerror=done;V.t=setTimeout(()=>{try{speechSynthesis.cancel()}catch(e){}done()},2500+it.t.length*150);speechSynthesis.speak(u)}
function voiceStatus(){const el=$('vst');if(!('speechSynthesis' in window)){el.textContent='🔇 แอปนี้ไม่รองรับเสียงพูด — เปิดใน Chrome';return}pickVoice();el.textContent=V.voice?'🔊 พร้อม: '+V.voice.name:'⚠️ ไม่พบเสียงไทย — ติดตั้ง Google TTS'}
/* ---------- server link ---------- */
const viaServer=location.protocol.startsWith('http')&&!/claude|claudeusercontent/.test(location.host);
function mkImg(u){const im=new Image();im.src=viaServer?'/av?u='+encodeURIComponent(u):u;return im}
let ws=null,wsOk=false,wsFail=0;
function wsConnect(){if(!viaServer){$('wst').textContent='โหมดทดสอบ (เปิดจากลิงก์ onrender เพื่อเชื่อม TikTok)';return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{wsOk=true;$('wst').textContent='✅ ต่อเซิร์ฟเวอร์แล้ว';clearInterval(window._pg);window._pg=setInterval(()=>{try{ws.readyState===1&&ws.send('{"type":"ping"}')}catch(e){}},240000)};
 ws.onmessage=m=>{let d;try{d=JSON.parse(m.data)}catch(e){return}if(d.type==='status')$('wst').textContent=d.text;else handle(d)};
 ws.onclose=()=>{if(!wsOk&&++wsFail>=2){$('wst').textContent='โหมดทดสอบ';return}setTimeout(wsConnect,4000)}}
try{$('ttUser').value=localStorage.getItem('pr_tt')||''}catch(e){}
$('bConn').onclick=()=>{const u=$('ttUser').value.trim().replace(/^@/,'');try{localStorage.setItem('pr_tt',u)}catch(e){}if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:'connect',username:u}));$('wst').textContent='กำลังเชื่อม @'+u+'…'}else{wsFail=0;wsConnect()}};
wsConnect();
/* ---------- controls ---------- */
$('bStart').onclick=()=>{$('start').remove();muInit();try{speechSynthesis.cancel()}catch(e){}setTimeout(voiceStatus,300);say('รถแห่ม่วนซื่นมาแล้ว! พิมพ์ เต้น มาม่วนด้วยกันเลย!',3)};
function muLabel(){$('bMu').textContent='🎵 เพลง: '+(MU.on?'เปิด':'ปิด');$('bMv').textContent='ความดัง '+Math.round(MU.vol*100)+'%'}muLabel();
$('bMu').onclick=()=>{MU.on=!MU.on;try{localStorage.setItem('pr_mu',MU.on?'1':'0')}catch(e){}muInit();muVol();muLabel()};
$('bMv').onclick=()=>{const L=[.3,.45,.6,.8,1];MU.vol=L[(L.findIndex(v=>v>=MU.vol-.01)+1)%L.length];try{localStorage.setItem('pr_mv',MU.vol)}catch(e){}muVol();muLabel()};
$('bVoice').onclick=()=>{muInit();try{speechSynthesis.cancel()}catch(e){}V.busy=false;V.q=[];say('ทดสอบเสียง ม่วนซื่นโฮแซว!',3);setTimeout(voiceStatus,300)};
$('gear').onclick=()=>$('panel').classList.toggle('show');
$('bHide').onclick=()=>{$('panel').classList.remove('show');document.body.classList.add('live')};
let taps=[];$('hot').addEventListener('pointerdown',()=>{const n=Date.now();taps=taps.filter(t=>n-t<900);taps.push(n);if(taps.length>=3){taps=[];document.body.classList.remove('live');$('panel').classList.add('show')}});
const NM=['น้องฝน','Beam','ป้าแดง','ลุงดู่','Aom','Plo','เจ๊หมวย','Nok','มะปราง','ต้นกล้า','แม่ค้า','Zin','ก้อย','บอย','ใบเตย','โอ๊ต','แจ็ค','มิว','เบล','ต้า','นัท','กิ๊ฟ','ปาล์ม','ฟ้า'];let ni=0;
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;if(k==='join'){for(let i=0;i<6;i++){const n=NM[ni%NM.length]+(ni>=NM.length?ni:'');ni++;handle({type:'chat',user:'u'+ni,nick:n,comment:'เต้น'})}return}
 const c=S.crowd.length?pick(S.crowd):{id:'u0',nick:'น้องฝน'};if(k==='like')return handle({type:'like',user:c.id,nick:c.nick,count:20});
 const G={rose:['Rose',1],tiktok:['TikTok',1],donut:['Doughnut',30],hands:['Hand Hearts',100],money:['Money Gun',500],galaxy:['Galaxy',1000],whale:['Whale diving',2150],universe:['TikTok Universe',44999]}[k];handle({type:'gift',user:c.id,nick:c.nick,giftName:G[0],diamonds:G[1],count:1})});
</script>
